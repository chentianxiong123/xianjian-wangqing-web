<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仙剑奇侠传-忘情篇</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b12;color:#c8c8d0;
    font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #wrap{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  canvas{background:#000;border:1px solid #2a2a38;image-rendering:pixelated;
    display:block;touch-action:none}
  #side{width:270px;font-size:12px}
  #side h2{font-size:13px;margin:14px 0 6px;color:#8cf;border-bottom:1px solid #2a2a38;
    padding-bottom:3px}
  #side h2:first-child{margin-top:0}
  select,button{background:#1a1a26;color:#c8c8d0;border:1px solid #34344a;
    padding:4px 7px;font:inherit;cursor:pointer;width:100%;margin-bottom:4px}
  select:hover,button:hover{background:#25253a}
  table{border-collapse:collapse;width:100%;font:11px/1.5 monospace}
  td,th{border-bottom:1px solid #1e1e2a;padding:2px 4px;text-align:left}
  th{color:#7a7a90;font-weight:normal}
  #log{height:150px;overflow:auto;background:#0e0e16;border:1px solid #2a2a38;
    padding:5px;font:10px/1.45 monospace;white-space:pre-wrap}
  .k{color:#7cf}.v{color:#9c9}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="272"></canvas>
  <div id="side">
    <h2>选地图</h2>
    <select id="mapSel"></select>
    <button id="btnReload">重新载入</button>

    <h2>角色</h2>
    <select id="antSel"></select>
    <button id="btnState">切换状态</button>

    <h2>事件标记</h2>
    <div id="evBox" style="max-height:120px;overflow:auto"></div>
    <button id="btnReloadEv">按当前标记重装</button>

    <h2>操作</h2>
    <table>
      <tr><th>方向键 / WASD</th><td>移动</td></tr>
      <tr><th>回车 / 空格</th><td>对话 / 推进</td></tr>
      <tr><th>T</th><td>传送到本图出口</td></tr>
      <tr><th>G</th><td>显示网格</td></tr>
    </table>

    <h2>运行时</h2>
    <table id="stat"></table>

    <h2>日志</h2>
    <div id="log"></div>
  </div>
</div>

<!-- 数据：由 2-工具/60-生成web数据.py 从 3-数据/ 生成，请勿手改 -->
<script src="data/xj_bin.js"></script>
<script src="data/xj_ant.js"></script>
<script src="data/xj_maps.js"></script>
<script src="data/xj_npc.js"></script>
<script src="data/xj_config.js"></script>
<script src="data/xj_logic.js"></script>
<script src="data/xj_scripts.js"></script>
<!-- 引擎 -->
<script src="src/xj.js"></script>
<script src="src/xj_script.js"></script>
<script src="src/xj_world.js"></script>
<script src="src/xj_talk.js"></script>
<script src="src/xj_battle.js"></script>
<script src="src/xj_view.js"></script>

<script>
(function(){
  'use strict';
  var logEl = document.getElementById('log');
  function log(s){ logEl.textContent = s + '\n' + logEl.textContent;
    while(logEl.textContent.length > 4000) logEl.textContent =
      logEl.textContent.slice(logEl.textContent.indexOf('\n')+1); }

  var scene = new XJScene(document.getElementById('cv'));
  window.scene = scene;
  scene.onLog = log;

  // ---- 地图下拉 ----
  var names = Object.keys(XJ.data.maps.maps).sort();
  var sel = document.getElementById('mapSel');
  names.forEach(function(n){
    var o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o);
  });
  sel.value = 'cs_ljb_1';

  // ---- ANT 下拉（作为主角立绘）----
  var ants = Object.keys(XJ.data.ant.ants).sort();
  var asel = document.getElementById('antSel');
  ants.forEach(function(n){
    var o = document.createElement('option'); o.value = o.textContent = n; asel.appendChild(o);
  });
  // 注意：不存在 renwu.ant，角色地图精灵由游戏内逻辑决定；
  // 这里先用 npc_1 做渲染验证
  asel.value = 'npc_1';

  var STATES = ['站立','走路','攻击','闪避','死亡'];
  var si = 0;
  document.getElementById('btnState').onclick = function(){
    si = (si + 1) % STATES.length;
    scene.player.state = STATES[si];
    log('主角状态 → ' + STATES[si]);
  };
  asel.onchange = function(){ scene.player.ant = asel.value; log('主角 ANT → ' + asel.value); };

  function loadMapOld(){
    var n = sel.value;
    if (!scene.load(n)) { log('✗ 地图不存在 ' + n); return; }
    scene.player.ant = asel.value;
    scene.player.state = '站立';
    // 预载该地图用到的 BIN
    var bins = [scene.m.tileBin, scene.m.elementAnt &&
                (XJ.data.ant.ants[scene.m.elementAnt]||{}).bin].filter(Boolean);
    var bins2 = (scene.m.elementAnts||[]).map(function(a){
      return XJ.data.ant.ants[a] && XJ.data.ant.ants[a].bin; }).filter(Boolean);
    bins = bins.concat(bins2).filter(function(v,i,a){return a.indexOf(v)===i;});
    var left = bins.length;
    bins.forEach(function(b){ XJ.preloadBin(b, function(){ if(--left===0) log('精灵图预载完成'); }); });
    log('(旧)预载 BIN=' + bins.join(','));
  }
  sel.onchange = loadMap;
  document.getElementById('btnReload').onclick = loadMap;
  void loadMapOld;

  // ---- 运行时统计 ----
  setInterval(function(){
    var s = scene.stats, m = scene.m;
    document.getElementById('stat').innerHTML =
      '<tr><th>地图</th><td>' + (scene.mapName||'-') + '</td></tr>' +
      '<tr><th>尺寸</th><td>' + (m?m.cols+'×'+m.rows+' 格':' -') + '</td></tr>' +
      '<tr><th>地砖 BIN</th><td>' + (m?m.tileBin:'-') + '</td></tr>' +
      '<tr><th>元素 ANT</th><td>' + (m?m.elementAnt:'-') + '</td></tr>' +
      '<tr><th>本帧地砖</th><td>' + s.tiles + '</td></tr>' +
      '<tr><th>本帧元素</th><td>' + s.objs + '</td></tr>' +
      '<tr><th>缺资源</th><td>' + s.miss + '</td></tr>' +
      '<tr><th>精灵缓存</th><td>' + Object.keys(XJ.imgCache).length + ' 包</td></tr>' +
      '<tr><th>加载失败</th><td>' + Object.keys(XJ.imgFailed).length + '</td></tr>' +
      '<tr><th>脚本元素</th><td>' + (scene.world.elements||[]).length + '</td></tr>' +
      '<tr><th>触发区</th><td>' + (scene.world.zones||[]).length + '</td></tr>' +
      '<tr><th>出口</th><td>' + (scene.m?scene.m.exits.length:0) + '</td></tr>' +
      '<tr><th>事件标记</th><td>' + Object.keys(scene.world.events).filter(k=>scene.world.events[k]===1).length + '</td></tr>' +
      '<tr><th>对话</th><td>' + (scene.talk ? (scene.talk.active?'进行中 p'+scene.talk.page:'已结束') : '无') + '</td></tr>' +
      '<tr><th>对话框</th><td>' + (scene.dialogBox ? String(scene.dialogBox.text).slice(0,12) : '无') + '</td></tr>';
  }, 500);

  // 事件标记面板：条件驱动的 NPC 出现/离场靠它
  var evBox = document.getElementById('evBox');
  function evNumbers(){
    var s = new Set();
    (scene.m ? scene.m.script : []).concat.apply([], (scene.m ? scene.m.layers : [])
      .map(function(L){ return (L.o||[]).map(function(o){return o[3]||[];}); }));
    (scene.m ? scene.m.script : []).forEach(function(c){
      if (c.cond && c.cond.terms) c.cond.terms.forEach(function(t){
        if (t.fn==='eventMarked') s.add(t.args[0].value); }); });
    (scene.m ? scene.m.layers : []).forEach(function(L){
      (L.o||[]).forEach(function(o){ (o[3]||[]).forEach(function(c){
        if (c.cond && c.cond.terms) c.cond.terms.forEach(function(t){
          if (t.fn==='eventMarked') s.add(t.args[0].value); }); }); }); });
    return Array.from(s).sort(function(a,b){return a-b;});
  }
  function renderEvPanel(){
    var nums = evNumbers();
    evBox.innerHTML = nums.length ? '' : '<div style="color:#666">本图无条件依赖的事件</div>';
    nums.forEach(function(n){
      var lab = document.createElement('label');
      lab.style.cssText='display:block;font:11px monospace';
      var cb = document.createElement('input');
      cb.type='checkbox'; cb.checked = !!scene.world.events[n];
      cb.onchange = function(){ scene.world.events[n] = cb.checked ? 1 : 0; };
      lab.appendChild(cb); lab.appendChild(document.createTextNode(' event' + n));
      evBox.appendChild(lab);
    });
  }
  document.getElementById('btnReloadEv').onclick = loadMap;
  window.addEventListener('keydown', function(e){
    if (e.key==='t'||e.key==='T'){
      var ex = scene.world.nearestExit(scene.px, scene.py, scene.player.dir);
      if (ex){ log('出口 → ' + ex.to + ' @' + ex.x + ',' + ex.y + ' (' + ex.dir + ')'); scene.goto(ex.to, ex.x, ex.y, ex.dir); }
      else log('本图未找到出口');
    }
  });
  function loadMap(){
    var n = sel.value;
    if (!scene.load(n)) { log('✗ 地图不存在 ' + n); return; }
    scene.player.ant = asel.value;
    scene.player.state = '站立';
    renderEvPanel();
    log('载入 ' + n + '  ' + scene.m.cols + '×' + scene.m.rows + ' 格  '
        + '无脚本元素 ' + scene.world.plainObjects.length
        + '  脚本元素 ' + scene.world.elements.length
        + '  地图级指令 ' + scene.m.script.length);
  }
  loadMap();
  scene.start();

  // 全库预载：浏览器对同域并发连接数有限，一次发 461 个请求会互相排队
  var t0 = Date.now();
  var pl = XJ.preloadAll(12, function(done, total, fin){
    if (done % 60 === 0 || fin) {
      var a = XJ.allStats();
      log('精灵图 ' + done + '/' + total + '  ok=' + a.ok + ' pending=' + a.pending
          + ' idle=' + a.idle + ' missing=' + a.missing
          + '  用时 ' + ((Date.now()-t0)/1000).toFixed(1) + 's');
    }
    if (fin) log('精灵图全部处理完毕，missing=' + a_missing());
  });
  function a_missing(){ return XJ.allStats().missing; }
  log('就绪：' + names.length + ' 张地图 / ' + ants.length + ' 个 ANT / '
      + XJ.data.bin.count + ' 张精灵图');
  log('战斗行动阈值 W=' + XJ.C().W + '（读自 07-逻辑）');
})();
</script>
</body>
</html>
